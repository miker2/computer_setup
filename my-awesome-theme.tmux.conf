# =============================================================================
#  TMUX THEME: NORD-ISH (with Powerline)
# =============================================================================
# NOTE: For icons and Powerline symbols to work, you need a Nerd Font.

# --- COLORS & SYMBOLS ---
# Define Nord colors for easy reuse
set -ogq @nord0  "#2e3440" # black
set -ogq @nord4  "#3b4252" # dark gray
set -ogq @nord6  "#eceff4" # white
set -ogq @nord8  "#88c0d0" # teal
set -ogq @nord9  "#81a1c1" # blue
set -ogq @nord11 "#bf616a" # red
# Powerline Symbols:  (Right)  (Left)

# --- PANE STYLING ---
set -g pane-border-style "fg=#{@nord4}"
set -g pane-active-border-style "fg=#{@nord8}"

# --- MESSAGE STYLING ---
set -g message-style "bg=#{@nord4},fg=#{@nord6}"

# --- STATUS BAR ---
set -g status-position bottom
#set -g status-bg @nord4
set -g status-justify left
set -g status-style "bg=#{@nord4},fg=#{@nord6}" # Default statusbar colors

# LEFT side of status bar
set -g status-left-length 100
set -g status-left "#[bg=#{@nord8},fg=#{@nord0},bold]  #S "\
"#[bg=#{@nord4},fg=#{@nord8}]" # Powerline separator

# RIGHT side of status bar
set -g status-right-length 100
set -g status-right "#[bg=#{@nord4},fg=#{@nord9}]"\
"#[bg=#{@nord9},fg=#{@nord0}]  #H "\
"#[bg=#{@nord9},fg=#{@nord11}]"\
"#[bg=#{@nord11},fg=#{@nord6},bold] %Y-%m-%d %I:%M %p "

# --- WINDOWS ---
# Inactive window style
setw -g window-status-style "fg=#{@nord6},bg=#{@nord4}"

# Active window style (wrapped in Powerline symbols)
setw -g window-status-current-format "#[bg=#{@nord9},fg=#{@nord4}]"\
"#[bg=#{@nord9},fg=#{@nord0},bold] #I: #W#F "\
"#[bg=#{@nord4},fg=#{@nord9}]"

# Format for inactive windows
setw -g window-status-format "#[fg=#{@nord6},bg=#{@nord4}] #I: #W#F "

# Style for windows with activity
setw -g window-status-activity-style "fg=#{@nord8},bg=#{@nord4}"

# --- CLOCK ---
setw -g clock-mode-colour "#81a1c1" 

